# OpenOCD configuration: SEGGER J-Link + Raspberry Pi Zero 2W (AArch32 kernel)
#
# Hardware debug via the SEGGER J-Link probe on JTAG.
#   - Interface: interface/jlink.cfg
#   - Target:    rpi3-aarch32.cfg (bcm2837-aarch32.cfg: aarch64+CTI targets,
#                adapter speed 4000, reset_config trst_only, transport jtag)
#
# This is for JLINK.
#
# NOTE: The Pi has NO SRST and the Cortex-A53 debug target has no reset method,
# so OpenOCD cannot "reset" (you get "how to reset?"). Use the cortex-debug
# "attach" request (launch.json), which does NOT reset: it halts, GDB loads the
# ELF into RAM, sets a hardware breakpoint at the entry, and lets the board boot
# its SD kernel7.img to that entry.
#
# Semihosting (C++ kernel, hlt #0xF000) is enabled afterwards via launch.json
# openOCDLaunchCommands: ["arm semihosting enable"].

source [find interface/jlink.cfg]
source [find rpi3-aarch32.cfg]

# Only core 0 gets a GDB server; cores 1-3 stay parked (secondary-core parking
# in boot.S). Avoids 4 gdb servers on consecutive ports colliding with
# tcl/telnet ports.
bcm2837.cpu1 configure -gdb-port disabled
bcm2837.cpu2 configure -gdb-port disabled
bcm2837.cpu3 configure -gdb-port disabled

# Halt the target during OpenOCD startup (no reset on the Pi).
init
halt
