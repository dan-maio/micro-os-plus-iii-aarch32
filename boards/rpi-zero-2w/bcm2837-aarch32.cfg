# BCM2837/BCM2710A1 (Raspberry Pi 3 / Pi Zero 2W) Target Configuration
# for debugging an AArch32 (32-bit) kernel.
#
# IMPORTANT: The Cortex-A53 cores MUST use the "aarch64" target type with
# a Cross-Trigger Interface (CTI).
#
#   - The ARMv7-style "cortex_a" target does NOT support -cti. On a
#     Cortex-A53 the core cannot be halted/examined without the CTI, so
#     examination fails with:
#       "JTAG-DP STICKY ERROR" / "Examination failed" / DSCR timeouts.
#   - The "aarch64" target drives the same CoreSight debug interface and
#     halts/examines the core correctly EVEN WHILE IT IS RUNNING AN
#     AArch32 KERNEL.
#
# NOTE: AArch32 semihosting is not available through the aarch64 target.
# Use the UART for console I/O (this kernel does).

if { [info exists CHIPNAME] } {
	set  _CHIPNAME $CHIPNAME
} else {
	set  _CHIPNAME bcm2837
}

if { [info exists CHIPCORES] } {
	set _cores $CHIPCORES
} else {
	set _cores 4
}

if { [info exists USE_SMP] } {
	set _USE_SMP $USE_SMP
} else {
	set _USE_SMP 0
}

if { [info exists DAP_TAPID] } {
	set _DAP_TAPID $DAP_TAPID
} else {
	set _DAP_TAPID 0x4ba00477
}

jtag newtap $_CHIPNAME cpu -expected-id $_DAP_TAPID -irlen 4

# Raspberry Pi boards only expose Test Reset (TRST) pin, no System Reset (SRST)
reset_config trst_only

# Adapter speed: 1000 kHz (not 4000).
# 4000 kHz works with a J-Link but the FTDI-based Olimex ARM-USB-OCD
# cannot clock JTAG reliably at 4000 kHz over jumper wires (causes
# "JTAG scan chain interrogation failed: all ones"). If 1000 still
# gives errors, drop to 500 then 100.
adapter speed 1000

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# MEM-AP for direct access
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0

# Debug base / CTI base addresses from the ROM table (dap info 0)
set _DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set _CTIBASE {0x80018000 0x80019000 0x8001a000 0x8001b000}

set _smp_command "target smp"

for { set _core 0 } { $_core < $_cores } { incr _core } {
	set _CTINAME $_CHIPNAME.cti$_core
	set _TARGETNAME $_CHIPNAME.cpu$_core

	cti create $_CTINAME -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE $_core]
	target create $_TARGETNAME aarch64 -dap $_CHIPNAME.dap -ap-num 0 -dbgbase [lindex $_DBGBASE $_core] -cti $_CTINAME
	$_TARGETNAME configure -event reset-assert-post { aarch64 dbginit }

	set _smp_command "$_smp_command $_TARGETNAME"
}

if {$_USE_SMP} {
	eval $_smp_command
}

# default target is cpu0
targets $_CHIPNAME.cpu0
