# Raspberry Pi 3 / Pi Zero 2W Board Configuration - AArch32 Mode
#
# This is for kernels running in 32-bit ARM (AArch32) mode on RPi3 / Zero 2W.
# Both boards use the same BCM2837/BCM2710A1 SoC and JTAG TAP.
# Uses custom bcm2837-aarch32.cfg instead of standard bcm2837.cfg.

# Use the custom AArch32 target configuration
source [find bcm2837-aarch32.cfg]

# JTAG transport
transport select jtag

# Raspberry Pi boards only expose Test Reset (TRST) pin, no System Reset (SRST)
reset_config trst_only
