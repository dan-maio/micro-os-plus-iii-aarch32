# OpenOCD configuration: Olimex ARM-USB-OCD + Raspberry Pi 3 B / Zero 2 W (AArch32)
#
# Standalone OpenOCD equivalent of the Eclipse "GNU MCU OpenOCD" launch that
# uses the Olimex probe:
#   -f interface/ftdi/olimex-arm-usb-ocd.cfg -c "transport select jtag" \
#   -f <target cfg>
#   - Interface: interface/ftdi/olimex-arm-usb-ocd.cfg (FTDI, JTAG)
#   - Target:    rpi3-aarch32.cfg / bcm2837-aarch32.cfg (4x Cortex-A53 as AArch32)
#   - Mode:      Pure OpenOCD command-line session (NO GDB SERVER NEEDED).
#
# The FTDI-based Olimex probe cannot clock JTAG reliably at 4000 kHz over
# jumper wires, so use 1000 kHz (bcm2837-aarch32.cfg already sets this; kept
# here too for clarity).

source [find interface/ftdi/olimex-arm-usb-ocd.cfg]
transport select jtag
adapter speed 1000
source [find rpi3-aarch32.cfg]

# Disable GDB servers on cores 1..3
bcm2837.cpu1 configure -gdb-port disabled
bcm2837.cpu2 configure -gdb-port disabled
bcm2837.cpu3 configure -gdb-port disabled

# Pure OpenOCD initialisation
init
halt
