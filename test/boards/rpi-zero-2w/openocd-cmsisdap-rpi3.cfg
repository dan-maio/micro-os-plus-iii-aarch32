# OpenOCD configuration: a CMSIS-DAP probe + Raspberry Pi 3 B / Zero 2 W (AArch32)
#
# Hardware debug on JTAG through any CMSIS-DAP probe (e.g. the Raspberry Pi
# Debug Probe, or a Pico running the debugprobe firmware).
#   - Interface: interface/cmsis-dap.cfg, switched to JTAG
#   - Target:    rpi3-aarch32.cfg / bcm2837-aarch32.cfg (4x Cortex-A53 as
#                AArch32), which also set the JTAG clock
#
# Declarative, like openocd-jlink-rpi3.cfg: init and the run commands are
# issued by run-hw.sh after this config is sourced (hw.sh, PROBE=cmsis-dap,
# UOS_HW_CFG_INIT=1). With several CMSIS-DAP probes connected, select this
# board's with `adapter serial <serial>` (OpenOCD otherwise takes the first).

source [find interface/cmsis-dap.cfg]
transport select jtag
source [find rpi3-aarch32.cfg]

# No GDB: OpenOCD alone halts, loads and resumes.
gdb port disabled
