# reset.cfg — reset the Pi through its watchdog, then exit (step 4 of
# docs/tests/RPI-ZERO-2W-HARDWARE-STEPS.md in micro-os-plus-iii).
#
#   openocd -s <this folder> -f openocd-jlink-rpi3.cfg -f reset.cfg
#   sleep 12
#
# The "Invalid ACK (0) in DAP response" errors at the end are expected: the
# chip resets while the probe is still talking to it.

init
targets bcm2837.cpu0; halt
mww 0x3f100024 0x5a000001
mww 0x3f10001c 0x5a000020
shutdown
