# OpenOCD configuration: SEGGER J-Link + Raspberry Pi Zero 2W (AArch32 kernel)
#
# Hardware debug via the SEGGER J-Link probe on JTAG.
#   - Interface: interface/jlink.cfg
#   - Target:    rpi3-aarch32.cfg (bcm2837-aarch32.cfg: aarch64+CTI targets,
#                adapter speed 4000, reset_config trst_only, transport jtag)
#
# This is for JLINK.
#
# NOTE: The Pi has NO SRST and the Cortex-A53 debug target has no reset method,
# so OpenOCD cannot "reset" (you get "how to reset?"). The session attaches
# instead: halt, load_image into RAM, set the PC, resume -- all of it issued by
# run-hw.sh as OpenOCD commands, with "arm semihosting enable" among them.
#
# PURELY DECLARATIVE, like the AArch64 port's config: no `init`, no `halt`
# here. hw.sh (UOS_HW_CFG_INIT=1) has run-hw.sh issue them:
#
#     openocd -f openocd-jlink-rpi3.cfg -c "init" -f <run-commands.cfg>
#
# The previous version, which ran `init` and `halt` itself, is kept in
# openocd-jlink-rpi3.cfg.bak.

source [find interface/jlink.cfg]
source [find rpi3-aarch32.cfg]

# No GDB: OpenOCD alone halts, loads and resumes; the application talks
# through the UART and semihosting. Switching the server off also frees the
# 3333..3336 ports the four cores would otherwise take.
gdb port disabled
