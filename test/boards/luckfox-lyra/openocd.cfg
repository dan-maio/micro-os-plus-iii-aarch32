# openocd.cfg - attach a CMSIS-DAP probe to the RK3506 Cortex-A7 over SWD

# There is no GDB anywhere in this workspace: OpenOCD halts the cores, loads
# the image and resumes them, and the application talks through the UART and
# semihosting. The GDB server is therefore switched off outright.
gdb port disabled

# --- adapter -----------------------------------------------------------------
adapter driver cmsis-dap
# Pin OpenOCD to WCH-Link CMSIS-DAP probe (USB 1a86:8011)
cmsis-dap vid_pid 0x1a86 0x8011
transport select swd

# Reliable SWD speed
adapter speed 4000

# Attach to the bootloader-loaded code -- no SRST/JTAG reset
reset_config none separate

# --- DAP ---------------------------------------------------------------------
set _CHIPNAME rk3506
swd newdap $_CHIPNAME cpu -irlen 4
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# --- targets: 3x Cortex-A7 ---------------------------------------------------
target create $_CHIPNAME.a7.0 cortex_a -dap $_CHIPNAME.dap -coreid 0
target create $_CHIPNAME.a7.1 cortex_a -dap $_CHIPNAME.dap -coreid 1 -defer-examine
target create $_CHIPNAME.a7.2 cortex_a -dap $_CHIPNAME.dap -coreid 2 -defer-examine

# Work area (DDR scratch)
$_CHIPNAME.a7.0 configure -work-area-phys 0x00100000 -work-area-size 0x10000 -work-area-backup 1

# Attach-only
$_CHIPNAME.a7.0 configure -event reset-assert {}
$_CHIPNAME.a7.1 configure -event reset-assert {}
$_CHIPNAME.a7.2 configure -event reset-assert {}

$_CHIPNAME.a7.0 configure -event resumed {
	after 1000 examine_secondaries
}

# --- helpers -----------------------------------------------------------------
# Examine the secondaries ONCE, when the kernel has released them, and say
# nothing.
#
# This used to run from the `resumed` event on EVERY resume, and print an
# "examined OK" line each time. Semihosting resumes the core once per trapped
# call, and this port prints one character per call, so a single banner
# scheduled hundreds of examinations -- every one of them writing log lines
# into the same stdout as the target's semihosting, shredding the console
# output ("o", "Info:...", "s", "rk3506.a7.1 examined OK", "_", ...).
#
# Examine each secondary at most once. The flag is latched only when BOTH
# succeed, so a first attempt that lands before the kernel releases them is
# retried on the next resume; after that it is a no-op. Print nothing: the
# runner does not read these lines, and they were the noise.
set _secondaries_examined 0
proc examine_secondaries {} {
	global _secondaries_examined
	if {$_secondaries_examined} { return }
	# Silence OpenOCD's own examination chatter -- the two lines
	#   Info : [rk3506.a7.1] hardware has 6 breakpoints, 4 watchpoints
	#   Info : [rk3506.a7.2] hardware has 6 breakpoints, 4 watchpoints
	# are LOG_INFO (log) messages, so redirecting the log to /dev/null for the
	# duration hides them. Semihosting output is NOT a log message (it goes to
	# the target's own stdout FILE*), so the console is unaffected. Restore
	# with `log_output default` (stderr) afterwards.
	log_output /dev/null
	set ok 1
	foreach t {rk3506.a7.1 rk3506.a7.2} {
		if {[catch {$t arp_examine} e]} {
			set ok 0
		} else {
			catch {$t arm semihosting enable}
		}
	}
	log_output default
	if {$ok} { set _secondaries_examined 1 }
}

proc halt_all {} {
	foreach t {rk3506.a7.0 rk3506.a7.1 rk3506.a7.2} { catch {$t arp_halt} }
}

# --- bring up ----------------------------------------------------------------
init

$_CHIPNAME.a7.0 arm semihosting enable
targets $_CHIPNAME.a7.0
catch { halt }
echo "RK3506: 3x Cortex-A7 declared. Core0 attached over SWD."
